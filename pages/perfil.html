<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Perfil do profissional — EncontreCaap" />
  <title>Perfil — EncontreCaap</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/perfil.css" />
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark ec-navbar" aria-label="Navegação principal">
      <div class="container">
        <a class="navbar-brand ec-logo" href="../index.html">
          EncontreCaap<span class="ec-dot">.</span>
        </a>
        <a href="../index.html" class="btn ec-btn-outline-white ms-auto">
          <i class="bi bi-arrow-left me-1"></i> Voltar ao catálogo
        </a>
      </div>
    </nav>
  </header>

  <main class="ec-perfil-wrapper">
    <div class="container" id="perfilContainer">
      <!-- preenchido pelo JS -->
      <div class="text-center py-5 text-muted">
        <div class="spinner-border ec-spinner mb-3" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
        <p>Carregando perfil...</p>
      </div>
    </div>
  </main>

  <footer class="ec-footer" aria-label="Rodapé">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <a href="../index.html" class="ec-logo">EncontreCaap<span class="ec-dot">.</span></a>
        <p class="ec-footer-sub mt-1 mb-0">Projeto Comunidade Solidária — Goiana, PE</p>
      </div>
      <small class="ec-footer-copy">© 2026 EncontreCaap</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/dados.js"></script>
  <script src="../js/perfil.js"></script>

</html>
